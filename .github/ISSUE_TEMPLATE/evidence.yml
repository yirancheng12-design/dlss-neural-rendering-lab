name: Evidence or reproducibility report
description: Report a finding, failed run or correction with its limits.
body:
  - type: textarea
    id: setup
    attributes:
      label: Setup and exact versions
      description: Game build, GPU, driver, mod/runtime versions, settings and hashes. Remove personal paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observation and evidence
      description: Expected/actual result, scene, duration, capture method, fresh runtime evidence and failed runs.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Limits and restoration
      description: What was not tested? What remains UNKNOWN? How was the prior state restored?
    validations:
      required: true
